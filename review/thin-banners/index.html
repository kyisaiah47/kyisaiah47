<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub README Thin Banners — Compound Review</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 48px 24px 72px; background: #090a0c; color: #f5f5f5; font: 15px/1.5 Geist, system-ui, sans-serif; }
    main { width: min(1120px, 100%); margin: auto; }
    h1 { margin: 0 0 8px; font-size: 38px; letter-spacing: -.04em; }
    p { margin: 0; color: #a6a7aa; }
    h2 { margin: 38px 0 14px; color: #b8b9bc; font-size: 14px; font-weight: 600; }
    img { display: block; width: 100%; height: auto; border: 1px solid #2d2f33; }
    .stack { display: grid; gap: 14px; }
    .note { margin-top: 20px; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>Thin README banner review</h1>
    <p>Canonical Compound renderer, 1600×104 source canvas. Section header plus small task-specific object only.</p>
    <h2>Before</h2>
    <div class="stack">
      <img src="../../assets/strip-install.png" alt="Current Install banner">
      <img src="../../assets/strip-studio.png" alt="Current Studio banner">
      <img src="../../assets/strip-background.png" alt="Current Background banner">
    </div>
    <h2>Proposed</h2>
    <div class="stack">
      <img src="install.png" alt="Proposed Install banner">
      <img src="studio.png" alt="Proposed Studio banner">
      <img src="background.png" alt="Proposed Background banner">
    </div>
    <p class="note">No Compound signature, account handle, tagline, or supporting corner copy appears in the thin strips.</p>
  </main>
</body>
</html>
