<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000}
  .banner{
    width:1600px;height:460px;position:relative;overflow:hidden;
    font-family:"Bricolage Grotesque",system-ui,sans-serif;
    background-size:cover;background-position:center;
  }

  /* --- 3-col x 2-row rule frame --- */
  .frame{position:absolute;top:21%;bottom:21%;left:5.5%;right:5.5%;
    border:1px solid rgba(255,255,255,.16)}
  .vline{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.11)}
  .hline{position:absolute;left:0;right:0;height:1px;background:rgba(255,255,255,.11)}
  .vline.a{left:33.333%}.vline.b{left:66.666%}
  .hline.m{top:50%}
  .tick{position:absolute;width:9px;height:9px;background:rgba(255,255,255,.55);
    transform:translate(-50%,-50%)}

  /* --- framing labels --- */
  .lab{position:absolute;font-weight:600;font-size:15px;letter-spacing:.26em;
    text-transform:uppercase;color:rgba(255,255,255,.82)}
  .top{top:8.5%;left:50%;transform:translateX(-50%)}
  .bl{bottom:8.5%;left:5.5%}
  .br{bottom:8.5%;right:5.5%}

  /* --- center wordmark --- */
  .word{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    color:#fff;font-weight:800;letter-spacing:.03em;font-size:92px;
    text-shadow:0 4px 30px rgba(0,0,0,.4)}
</style>
</head>
<body>
  <div class="banner" id="banner">
    <div class="frame">
      <div class="vline a"></div><div class="vline b"></div>
      <div class="hline m"></div>
      <div class="tick" style="left:33.333%;top:50%"></div>
      <div class="tick" style="left:66.666%;top:50%"></div>
    </div>

    <div class="lab top">Founder &amp; Staff Engineer &nbsp;·&nbsp; 0-to-1 Product Builder &nbsp;·&nbsp; NYC</div>
    <div class="word">@kyisaiah47</div>
    <div class="lab bl">Compound Labs</div>
    <div class="lab br">Independent Product R&amp;D</div>
  </div>
  <script>
    // ⛔ The plate directory is passed in by render.mjs as ?plates=<file:// dir>.
    // It used to be hardcoded to ~/Projects/kynth/brand-studio/plates/, which was deleted
    // on 2026-07-22 (the set moved to kynth-ops/social/tools/bg/slate/). The generator then
    // rendered on a black ground for weeks and nothing said so, because a missing
    // background-image is not an error. render.mjs now HEADs the plate first and exits
    // non-zero if it is not there. Never hardcode the directory back in.
    var q = new URLSearchParams(location.search);
    var plates = q.get('plates');
    var plate  = q.get('plate') || 'AI_Bg_044.png';
    var pos    = q.get('pos')   || '50% 50%';
    var b = document.getElementById('banner');
    if (!plates) { document.title = 'MISSING-PLATES'; }
    else {
      b.style.backgroundImage = "url('" + plates.replace(/\/?$/, '/') + plate + "')";
      b.style.backgroundPosition = pos;
    }
  </script>
</body>
</html>
